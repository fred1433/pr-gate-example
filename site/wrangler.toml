# Test site of a fictional firm, served under theaipipe.com/demos/pr-gate-firm/
name = "pr-gate-firm"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "theaipipe.com/demos/pr-gate-firm", zone_name = "theaipipe.com" },
  { pattern = "theaipipe.com/demos/pr-gate-firm/*", zone_name = "theaipipe.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true

# The test inbox: every accepted lead is written here, and the checks read it back.
[[kv_namespaces]]
binding = "INBOX"
id = "ff0ac3d3161f436a9eb7687c16eb4f78"

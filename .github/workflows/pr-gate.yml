name: PR gate

# Trusted half of the gate. A workflow_run workflow is always taken from main, so a pull
# request cannot change it. It never executes the pull request's code on the runner:
# the PR is read as data (diff, site registry) and its build output, made by the
# "PR gate: build" job, runs inside workerd, which has no access to the disk.
# No secret is used anywhere: test tokens are drawn at random for each run.
on:
  workflow_run:
    workflows: ["PR gate: build"]
    types: [requested, completed]

permissions: {}

jobs:
  identify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.id.outputs.skip }}
      pr: ${{ steps.id.outputs.pr }}
      sha: ${{ steps.id.outputs.sha }}
      base_sha: ${{ steps.id.outputs.base_sha }}
      fork: ${{ steps.id.outputs.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gate
          persist-credentials: false
      - id: id
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gate/identify.mjs

  waiting:
    needs: identify
    if: github.event.action == 'requested' && needs.identify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gate
          persist-credentials: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.identify.outputs.pr }}
          HEAD_SHA: ${{ needs.identify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node gate/comment.mjs --waiting

  gate:
    needs: identify
    if: github.event.action == 'completed' && needs.identify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: pr-gate
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      PR: ${{ needs.identify.outputs.pr }}
      SHA: ${{ needs.identify.outputs.sha }}
      BASE_SHA: ${{ needs.identify.outputs.base_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gate-src
          fetch-depth: 0
          persist-credentials: false
      - name: main and the PR, checked out as data
        run: |
          cd gate-src
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/origin/pr-head"
          mb=$(git merge-base "$BASE_SHA" "$SHA")
          GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath=/dev/null worktree add --detach ../base "$mb"
          GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath=/dev/null worktree add --detach ../pr "$SHA"
          echo "main side: $mb, PR: $SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the gate (main's code, pinned wrangler) and main's site
        run: |
          npm ci --prefix gate-src/gate
          npx --prefix gate-src/gate playwright install --with-deps chromium
          npm ci --prefix base/site
      - name: Fetch the PR's build output
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-build
          path: untrusted
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Run the gate
        env:
          HEAD_SHA: ${{ needs.identify.outputs.sha }}
          FORK: ${{ needs.identify.outputs.fork }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body > pr-body.md
          extra=()
          if [ "$BUILD_CONCLUSION" = failure ]; then extra=(--pr-build-failed)
          elif [ ! -f untrusted/sha.txt ]; then extra=(--pr-build-missing "the build job ended $BUILD_CONCLUSION and left no output")
          elif [ "$(head -c 40 untrusted/sha.txt)" != "$SHA" ]; then extra=(--pr-build-missing "it was built from another commit")
          fi
          if [ "$FORK" != false ]; then export GATE_TEST_TOKENS=off; fi
          node gate-src/gate/run.mjs --base base --pr pr --pr-built untrusted --out "$RUNNER_TEMP/gate-out" --pr-body pr-body.md "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-evidence
          path: |
            ${{ runner.temp }}/gate-out/verdict.json
            ${{ runner.temp }}/gate-out/comment.md
            ${{ runner.temp }}/gate-out/shots/
            ${{ runner.temp }}/gate-out/logs/

  selftest:
    needs: identify
    if: github.event.action == 'completed' && needs.identify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          git fetch --force --tags origin
          npm ci --prefix gate
          npx --prefix gate playwright install --with-deps chromium
          npm ci --prefix site
      - name: Unit tests
        run: npm test --prefix gate
      - name: Self-test on every fixture
        run: node gate/selftest.mjs --work "$RUNNER_TEMP/selftest"

  publish:
    needs: [identify, gate, selftest]
    if: always() && github.event.action == 'completed' && needs.identify.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-evidence
          path: evidence-in
      - name: Post the verdict and the "PR gate" status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.identify.outputs.pr }}
          HEAD_SHA: ${{ needs.identify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node gate/comment.mjs --publish evidence-in/verdict.json --selftest "${{ needs.selftest.result }}" --gate-job "${{ needs.gate.result }}"
